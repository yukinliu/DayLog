name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - agent/windows-build

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: daylog-desktop

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: daylog-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate content configuration
        run: node scripts/release-check.mjs

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows NSIS installer
        run: npx tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: jianji-v0.1.0-windows-x64
          path: daylog-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
