[package]
name = "daylog-desktop"
version = "0.1.0"
description = "见己 Desktop"
authors = ["YKLSAC"]
edition = "2021"

[lib]
name = "daylog_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
